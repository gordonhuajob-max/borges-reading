<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Borges 读书笔记</title>
<style>
:root{--bg:#f7f5f0;--panel:#fffdf9;--text:#2b2a27;--muted:#7a766d;--line:#e6e1d6;--accent:#3d6b5a;--accent2:#e9f0ec;--danger:#b04a3c;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
--hy:#fbe7a1;--hg:#cdeccf;--hb:#cfe3f7;--hp:#f7d3df;--fs:17px}
[data-theme=dark]{--bg:#1b1c1e;--panel:#232427;--text:#dedad2;--muted:#9a958b;--line:#35363a;--accent:#7fb8a1;--accent2:#2a3531;--danger:#e0806f;--shadow:0 1px 3px rgba(0,0,0,.4);
--hy:#6b5a1f;--hg:#2f5a35;--hb:#2a4a68;--hp:#6a3446}
@media (prefers-color-scheme:dark){[data-theme=auto]{--bg:#1b1c1e;--panel:#232427;--text:#dedad2;--muted:#9a958b;--line:#35363a;--accent:#7fb8a1;--accent2:#2a3531;--danger:#e0806f;--shadow:0 1px 3px rgba(0,0,0,.4);--hy:#6b5a1f;--hg:#2f5a35;--hb:#2a4a68;--hp:#6a3446}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme=dark] button.primary{color:#10201a}
button.ghost{border-color:transparent;background:transparent}
button.small{padding:2px 8px;font-size:13px}
button.danger{color:var(--danger)}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:8px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .brand{font-weight:600;margin-right:auto;cursor:pointer;white-space:nowrap}
header.top nav{display:flex;gap:2px;flex-wrap:wrap}
header.top nav button{border:none;background:transparent;padding:5px 9px}
header.top nav button.on{background:var(--accent2);color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:18px 14px 80px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.book h3{margin:0 0 2px;font-size:20px}
.book .cover{height:6px;border-radius:6px 6px 0 0;margin:-16px -16px 12px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar>div{height:100%;background:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;padding:0 7px;border-radius:10px;background:var(--accent2);color:var(--accent);margin-left:4px;vertical-align:middle}
.badge.warn{background:#f6e7c8;color:#8a5a00}[data-theme=dark] .badge.warn{background:#4a3c1c;color:#e8c77a}
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px}
aside.toc{position:sticky;top:62px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding-right:4px}
aside.toc .ch{display:flex;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.45}
aside.toc .ch:hover{background:var(--accent2)}
aside.toc .ch.on{background:var(--accent2);color:var(--accent);font-weight:600}
.dot{flex:none;width:14px;text-align:center;color:var(--muted)}
.dot.s1{color:#c48a1b}.dot.s2{color:var(--accent)}
.reader{min-width:0}
.chead h1{font-size:24px;margin:4px 0 8px;line-height:1.4}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:4px 12px;background:var(--panel)}
.seg button.on{background:var(--accent);color:#fff}
[data-theme=dark] .seg button.on{color:#10201a}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 10px;overflow-x:auto}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:8px 12px;white-space:nowrap}
.tabs button.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
.content{font-size:var(--fs);max-width:760px}
.content p,.content li{margin:.55em 0}
.content h2{font-size:1.2em;margin:1.4em 0 .4em;color:var(--accent)}
.content h3{font-size:1.06em;margin:1.2em 0 .3em}
.content blockquote{margin:.8em 0;padding:.3em 1em;border-left:3px solid var(--accent);background:var(--accent2);border-radius:0 8px 8px 0}
.content ul,.content ol{padding-left:1.4em}
.notes [data-b]{position:relative;border-radius:4px;transition:background .3s;cursor:text}
.orig [data-b]{position:relative;border-radius:4px;transition:background .3s}
.orig p[data-b]{text-indent:2em;cursor:text}
.orig h3[data-b]{text-indent:0}
.orig .pg{color:var(--muted);font-size:12px;text-indent:0!important;margin:1.2em 0 .2em;letter-spacing:.05em}
.bm{box-shadow:-10px 0 0 -6px #c48a1b}
.bm::before{content:"读到这里";position:absolute;left:-0px;top:-1.35em;font-size:11px;color:#c48a1b;text-indent:0;white-space:nowrap}
.flash{background:var(--accent2)!important}
.bmbtn{position:absolute;right:0;top:-1.6em;z-index:5;font-size:12px;text-indent:0;padding:1px 8px;box-shadow:var(--shadow)}
mark.hl{color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
mark.c-y{background:var(--hy)}mark.c-g{background:var(--hg)}mark.c-b{background:var(--hb)}mark.c-p{background:var(--hp)}
mark.hl.has-note{border-bottom:2px dotted var(--muted)}
.swatch{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;vertical-align:middle}
.swatch.c-y{background:var(--hy)}.swatch.c-g{background:var(--hg)}.swatch.c-b{background:var(--hb)}.swatch.c-p{background:var(--hp)}
#seltool{position:absolute;z-index:50;display:none;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:6px 8px}
.pop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:14px}
.pop .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.notice{font-size:13px;padding:8px 12px;border-radius:8px;background:#f6e7c8;color:#6b4a00;margin:8px 0}
[data-theme=dark] .notice{background:#3d3218;color:#e8c77a}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:none}
.quote{border-left:3px solid var(--line);padding-left:10px;margin:6px 0}
.quote.c-y{border-color:#e0b93a}.quote.c-g{border-color:#5fae67}.quote.c-b{border-color:#5d97d1}.quote.c-p{border-color:#d4708f}
em.hit{font-style:normal;background:var(--hy);border-radius:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:99;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:.95}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px;max-width:760px}
.mobile-only{display:none}
.saved{font-size:12px;color:var(--muted)}
h2.sec{font-size:18px;margin:22px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){
 .layout{grid-template-columns:1fr}
 aside.toc{position:fixed;inset:0 25% 0 0;top:0;max-height:none;z-index:40;background:var(--panel);padding:14px;box-shadow:0 0 40px rgba(0,0,0,.3);transform:translateX(-105%);transition:transform .2s}
 aside.toc.open{transform:none}
 .mobile-only{display:inline-block}
 .grid2{grid-template-columns:1fr}
 header.top .brand span:not(.bt){display:none}
 :root{--fs:16.5px}
}
@media (max-width:520px){header.top{padding:6px 8px}header.top .brand{font-size:15px}header.top nav{flex-wrap:nowrap;overflow-x:auto}header.top nav button{padding:4px 6px;font-size:14px;white-space:nowrap} main{padding:12px 12px 80px}}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:24px 4px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px;max-width:360px}.prog>div{height:100%;background:var(--accent);transition:width .15s}
/*ADDON-CSS*/
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mstats .card{text-align:center;padding:12px 6px}.mstats b{display:block;font-size:26px;color:var(--accent)}.mstats span{font-size:13px;color:var(--muted)}
.mchart{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:8px}.mbar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;position:relative;min-width:0}
.mcol{flex:1;width:100%;display:flex;align-items:flex-end;background:color-mix(in srgb,var(--line) 40%,transparent);border-radius:3px}.mcol div{width:100%;background:var(--accent);border-radius:3px}
.mbar.today .mcol{outline:1px solid var(--accent)}.mlab{font-size:10px;color:var(--muted);height:14px}.mdot{position:absolute;top:-4px;font-size:10px;background:var(--accent2);color:var(--accent);border-radius:8px;padding:0 4px}
.mtab{width:100%;border-collapse:collapse;font-size:14px}.mtab th,.mtab td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}.mtab th{font-weight:600;color:var(--muted);font-size:13px}
@media (max-width:520px){.mstats{grid-template-columns:repeat(2,1fr)}.mtab{font-size:13px}}
/*/ADDON-CSS*/
</style>
</head>
<body>
<header class="top">
  <div class="brand" onclick="go('#/')">📚 Borges<span class="bt"> 读书笔记</span><span class="muted small"> · 六本书</span></div>
  <nav id="nav">
    <button data-r="shelf" onclick="go('#/')">书架</button>
    <button data-r="month" onclick="go('#/month')">月度</button>
    <button data-r="ask" onclick="go('#/ask')">提问</button>
    <button data-r="search" onclick="go('#/search')">搜索</button>
    <button data-r="marks" onclick="go('#/marks')">我的标记</button>
    <button data-r="data" onclick="go('#/data')">设置</button>
    <button data-r="account" onclick="go('#/account')">登录</button>
  </nav>
</header>
<main id="app"></main>
<div id="seltool">
  <span class="swatch c-y" data-c="y" title="黄色"></span><span class="swatch c-g" data-c="g" title="绿色"></span><span class="swatch c-b" data-c="b" title="蓝色"></span><span class="swatch c-p" data-c="p" title="粉色"></span>
  <button class="small" data-act="note">高亮并加注</button><button class="small" data-act="ask">提问</button>
</div>

让你走入瓶颈》。<\/p>\n<p>全书结构：卷一是纪实叙事，记者尼尔·史特劳斯化名“型男”潜入搭讪社群两年，从学员变成顶尖导师，再目睹“好莱坞计划”大宅崩塌，最后在真实的关系里走出来；卷二是“30 天改造计划”练习手册；卷三是谜男把整套方法写成的理论教材（M3 模型：吸引—舒适—诱惑，九个阶段）；卷四是谜男与 Lovedrop 的进阶讲义，从进化心理学讲到表达、打压、兴趣指标、接近、谈话与团体理论。<\/p>\n<p>阅读提示：这套书在社交心理、自我改造、刻意练习上有可借鉴之处，但其中不少技巧建立在操纵对方情绪、把人当“目标”的框架上（如“否定”、冷冻、制造嫉妒、“摧毁最后一刻的抵抗”）。笔记如实概括原书内容，并在相关处加了简短的反思；涉及亲密关系时，真实意愿与尊重永远优先于“技巧”。<\/p>\n<\/blockquote>","<h2>目录<\/h2>","<ul>\n<li>卷一 · 前言与 Step1 选定目标<\/li>\n<li>卷一 · Step2 接近与开场<\/li>\n<li>卷一 · Step3 展示价值<\/li>\n<li>卷一 · Step4 障碍排除<\/li>\n<li>卷一 · Step5 孤立目标<\/li>\n<li>卷一 · Step6 建立情感连接<\/li>\n<li>卷一 · Step7 取得引诱位置<\/li>\n<li>卷一 · Step8 刺激购买欲<\/li>\n<li>卷一 · Step9 进行身体接触<\/li>\n<li>卷一 · Step10 摧毁最终抵抗<\/li>\n<li>卷一 · Step11 管理期待（含术语注解）<\/li>\n<li>卷二 · 作者序与如何玩游戏<\/li>\n<li>卷二 · DAY 01–05 自我评估、口语与仪容<\/li>\n<li>卷二 · DAY 06–10 接近焦虑、开场与拒绝<\/li>\n<li>卷二 · DAY 11–15 身分、内心游戏与展示价值<\/li>\n<li>卷二 · DAY 16–20 讲话、播种与交换电话<\/li>\n<li>卷二 · DAY 21–25 沉默僚机、框架与电话技巧<\/li>\n<li>卷二 · DAY 26–30 熟悉感、标准化与自我价值<\/li>\n<li>卷三 · 前言、自序与第 1 章 大情圣背后之谜<\/li>\n<li>卷三 · 第 2 章 人生的终极目标<\/li>\n<li>卷三 · 第 3 章 改写她的恋爱电路<\/li>\n<li>卷三 · 第 4 章 游戏的规则与架构<\/li>\n<li>卷三 · 第 5 章 打开组合<\/li>\n<li>卷三 · 第 6 章 女对男的兴趣<\/li>\n<li>卷三 · 第 7 章 男对女的兴趣<\/li>\n<li>卷三 · 第 8 章 交谈<\/li>\n<li>卷三 · 第 9 章 中场游戏与结尾游戏<\/li>\n<li>卷三 · 结语、谜男的信、术语表与读后感<\/li>\n<li>卷四 · 序言与第一章 进化的背景<\/li>\n<li>卷四 · 第二章 游戏总览<\/li>\n<li>卷四 · 第三章 内化守则与第四章 表达<\/li>\n<li>卷四 · 第五章 如何开始<\/li>\n<li>卷四 · 第六章 打压<\/li>\n<li>卷四 · 第七章 兴趣<\/li>\n<li>卷四 · 第八章 接近<\/li>\n<li>卷四 · 第九章 谈话制造<\/li>\n<li>卷四 · 第十章 团体理论<\/li>\n<li>卷四 · 总结与附录<\/li>\n<\/ul>"],"ocr":false,"chapters":[{"t":"卷一 · 前言与 Step1 选定目标"},{"t":"卷一 · Step2 接近与开场"},{"t":"卷一 · Step3 展示价值"},{"t":"卷一 · Step4 障碍排除"},{"t":"卷一 · Step5 孤立目标"},{"t":"卷一 · Step6 建立情感连接"},{"t":"卷一 · Step7 取得引诱位置"},{"t":"卷一 · Step8 刺激购买欲"},{"t":"卷一 · Step9 进行身体接触"},{"t":"卷一 · Step10 摧毁最终抵抗"},{"t":"卷一 · Step11 管理期待（含术语注解）"},{"t":"卷二 · 作者序与如何玩游戏"},{"t":"卷二 · DAY 01–05 自我评估、口语与仪容"},{"t":"卷二 · DAY 06–10 接近焦虑、开场与拒绝"},{"t":"卷二 · DAY 11–15 身分、内心游戏与展示价值"},{"t":"卷二 · DAY 16–20 讲话、播种与交换电话" <script>
"use strict";
const BOOKS=JSON.parse(document.getElementById('bookdata').textContent);
/* ---------- lazy data loading (script injection works on file://) ---------- */
const SCRIPTS={};
window.BRN={put(id,kind,from,arr){const bk=BYID[id];if(!bk)return;arr.forEach((x,i)=>{bk.chapters[from+i][kind]=x})}};
function loadScript(src){if(SCRIPTS[src])return SCRIPTS[src];
 SCRIPTS[src]=new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.async=true;el.onload=()=>res();el.onerror=()=>{delete SCRIPTS[src];el.remove();rej(new Error('无法载入数据文件 '+src+'（请确认 data 文件夹和 index.html 在同一目录）'))};document.head.appendChild(el)});
 return SCRIPTS[src]}
function hasData(b,ci,src){return !!BYID[b].chapters[ci].n}
function need(b,ci,src){const bk=BYID[b];if(hasData(b,ci,src))return Promise.resolve();
 if(bk.nparts){const q=bk.nparts.find(p=>ci>=p[0]&&ci<p[1]);return loadScript('data/'+q[2])}
 return loadScript('data/'+bk.notesFile)}
function bookFiles(b){const bk=BYID[b];return bk.nparts?bk.nparts.map(p=>'data/'+p[2]):['data/'+bk.notesFile]}
/* this public edition only ships the notes; marks that pointed into the original text are kept in storage but hidden */
function vis(h){return h.src!=='o'}
function HLV(){return HL.filter(vis)}
let RTOK=0;
function loadingHTML(msg){return `<div class="loading"><span class="spin"></span>${esc(msg||'正在载入…')}</div>`}
function errorHTML(e){return `<div class="notice">${esc(e.message||String(e))}</div>`}
const BYID={};BOOKS.forEach(b=>BYID[b.id]=b);
const P='brn1:';
const COLORS={y:'黄',g:'绿',b:'蓝',p:'粉'};
const STATUS=['未读','在读','已读'];const SDOT=['○','◐','●'];
function load(k,d){try{const v=localStorage.getItem(P+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){toast('保存失败：浏览器存储不可用')}}
let CH=load('ch',{}),HL=load('hl',[]),QA=load('qa',[]),UI=load('ui',{theme:'auto',fs:17,last:{}});
if(!UI.last)UI.last={};
function saveAll(){save('ch',CH);save('hl',HL);save('qa',QA);save('ui',UI)}
function key(b,c){return b+'|'+c}
function chs(b,c){const k=key(b,c);if(!CH[k])CH[k]={s:0,bm:null,refl:'',notes:[]};return CH[k]}
function chget(b,c){return CH[key(b,c)]||{s:0,bm:null,refl:'',notes:[]}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
function applyTheme(){document.documentElement.dataset.theme=UI.theme||'auto';document.documentElement.style.setProperty('--fs',(UI.fs||17)+'px')}
applyTheme();
function go(h){if(location.hash===h)route();else location.hash=h}
function chTitle(b,c){return BYID[b].chapters[c].t}
function shortT(t){return t.length>22?t.slice(0,22)+'…':t}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
function quoteFmt(b,c,text){return `> 《${BYID[b].title}》${chTitle(b,c)}：${text}`}

/* ---------- plain text of note blocks (for search) ---------- */
const tmp=document.createElement('div');
function noteText(h){tmp.innerHTML=h;return tmp.textContent.replace(/\s+/g,' ').trim()}
const DOCSB={};
function buildBookDocs(bk){if(DOCSB[bk.id])return DOCSB[bk.id];const D=[];
 bk.chapters.forEach((ch,ci)=>{
  ch.n.forEach((h,i)=>{const t=noteText(h);if(t)D.push({b:bk.id,c:ci,src:'n',blk:i,t:t,lt:t.toLowerCase()})});
 });return DOCSB[bk.id]=D}
/* load + index the books needed for a search, with a progress indicator */
async function ensureDocs(ids,el){ids=ids&&ids.length?ids:BOOKS.map(b=>b.id);const todo=ids.filter(id=>!DOCSB[id]);
 if(todo.length&&el){el.innerHTML=`<div class="loading"><span class="spin"></span><span id="ixmsg">正在建立搜索索引…</span></div><div class="prog"><div id="ixbar" style="width:0%"></div></div>`}
 const files=[];todo.forEach(id=>bookFiles(id).forEach(f=>files.push([id,f])));let done=0;
 const tick=(m)=>{const b=document.getElementById('ixbar'),t=document.getElementById('ixmsg');if(b)b.style.width=Math.round(done/Math.max(1,files.length)*100)+'%';if(t&&m)t.textContent=m};
 for(const [id,f] of files){tick(`正在载入《${BYID[id].title}》… ${done+1}/${files.length}`);await loadScript(f);done++;tick()}
 for(const id of todo){tick(`正在建立《${BYID[id].title}》的索引…`);await new Promise(r=>setTimeout(r,0));buildBookDocs(BYID[id])}
}
function buildDocs(ids){ids=ids&&ids.length?ids:BOOKS.map(b=>b.id);const out=[];ids.forEach(id=>{if(DOCSB[id])out.push(...DOCSB[id])});return out}

/* ---------- Chinese-aware search ---------- */
const STOP=['为什么','怎么样','怎么办','是不是','有没有','什么是','如何','怎么','怎样','什么','哪些','哪个','为何','是否','可以','应该','能够','我们','你们','他们','自己','这个','那个','一个','一些','的话','请问','关于','以及','还是','或者','如果','就是','以及','吗','呢','吧','啊','了','的','地','得','和','与','及','我','你','他','她','是','在','有','把','被','让','对','要','会','能','也','都','就','还','很','又'];
function qTerms(q){
 let s=q.toLowerCase();
 const latin=(s.match(/[a-z0-9][a-z0-9.\-']*/g)||[]).filter(w=>w.length>1);
 s=s.replace(/[a-z0-9.\-']+/g,' ');
 const segs=s.split(/[^\u3400-\u9fff]+/).filter(Boolean);
 const grams=new Map();
 segs.forEach(seg=>{
  let parts=[seg];
  STOP.forEach(w=>{parts=parts.flatMap(p=>p.split(w))});
  parts=parts.filter(p=>p.length>=1);
  // keep original segment n-grams too (stopword removal can break phrases like 反过来想)
  const srcs=[seg,...parts];
  srcs.forEach((p,pi)=>{
   if(p.length===1&&pi>0){grams.set(p,Math.max(grams.get(p)||0,0.3));return}
   for(let n=2;n<=Math.min(4,p.length);n++)for(let i=0;i+n<=p.length;i++){const g=p.slice(i,i+n);if(STOP.includes(g))continue;grams.set(g,Math.max(grams.get(g)||0,pi===0?0.8:1))}
   if(p.length>4&&p.length<=10)grams.set(p,1.2);
  });
 });
 latin.forEach(w=>grams.set(w,1));
 return grams;
}
function rank(q,opt){
 opt=opt||{};const docs=buildDocs(opt.book?[opt.book]:null).filter(d=>(!opt.src||d.src===opt.src));
 const grams=qTerms(q);if(!grams.size)return[];
 const N=docs.length,gl=[...grams.entries()];
 const lower=docs.map(d=>d.lt||(d.lt=d.t.toLowerCase()));
 const df=gl.map(([g])=>{let n=0;for(const t of lower)if(t.indexOf(g)>=0)n++;return n});
 const res=[];
 docs.forEach((d,di)=>{
  const t=lower[di];let sc=0,hits=[];
  gl.forEach(([g,w],gi)=>{if(!df[gi])return;let k=t.indexOf(g);if(k<0)return;let cnt=0;while(k>=0&&cnt<4){cnt++;k=t.indexOf(g,k+g.length)}
   const idf=Math.log(1+N/df[gi]);const L=[...g].length;sc+=w*idf*Math.pow(L,1.6)*(1+0.35*(cnt-1));hits.push(g)});
  if(!sc)return;
  const whole=q.replace(/\s+/g,'');if(whole.length>=2&&t.indexOf(whole.toLowerCase())>=0)sc*=1.8;
  const len=d.t.length;sc=sc/(1+Math.log(1+len/260)*0.5);
  if(len<14)sc*=0.5;if(d.h)sc*=0.6;
  res.push({d,sc,hits});
 });
 // chapter density: passages from chapters that discuss the topic a lot rank higher
 const dens={};res.forEach(r=>{const k=r.d.b+'|'+r.d.c;dens[k]=(dens[k]||0)+r.sc});
 const mx=Math.max(1,...Object.values(dens));
 res.forEach(r=>{r.sc*=1+0.6*Math.sqrt(dens[r.d.b+'|'+r.d.c]/mx)});
 res.sort((a,b)=>b.sc-a.sc);
 return res.slice(0,opt.limit||10);
}
function snippet(t,hits,max){max=max||260;let pos=-1;const lt=t.toLowerCase();
 const hs=[...hits].sort((a,b)=>b.length-a.length);
 for(const h of hs){const k=lt.indexOf(h);if(k>=0){pos=k;break}}
 let s=t;if(t.length>max){const st=Math.max(0,Math.min(pos-60,t.length-max));s=(st>0?'…':'')+t.slice(st,st+max)+(st+max<t.length?'…':'')}
 let h=esc(s);hs.filter(x=>x.length>=2).forEach(g=>{h=h.split(esc(g)).join('\u0001'+esc(g)+'\u0002')});
 return h.replace(/\u0001/g,'<em class="hit">').replace(/\u0002/g,'</em>')}
function exactSearch(q,limit){const terms=q.toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length)return[];
 const out=[];for(const d of buildDocs()){const t=d.lt||(d.lt=d.t.toLowerCase());if(terms.every(x=>t.indexOf(x)>=0))out.push({d,sc:1,hits:terms});if(out.length>=limit)break}return out}

/* ---------- routing ---------- */
let CUR={};
window.addEventListener('hashchange',route);
function route(){
 RTOK++;hideSel();const h=location.hash||'#/';const parts=h.slice(2).split('?')[0].split('/').map(decodeURIComponent);
 const qs=new URLSearchParams(h.split('?')[1]||'');
 document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('on'));
 const on=r=>{const b=document.querySelector(`#nav button[data-r=${r}]`);b&&b.classList.add('on')};
 window.scrollTo(0,0);
 if(parts[0]==='b'&&BYID[parts[1]]){if(parts[2]===undefined||parts[2]==='')return viewBook(parts[1]);{let tab=parts[3]||'n',t=parts[4]!==undefined&&parts[4]!==''?+parts[4]:null;if(tab==='o'){tab='n';t=null;history.replaceState(null,'','#/b/'+parts[1]+'/'+parts[2]+'/n')}if(tab!=='n'&&tab!=='m')tab='n';return viewChapter(parts[1],+parts[2],tab,t)}}
 if(parts[0]==='ask'){on('ask');return viewAsk(qs.get('q')||'')}
 if(parts[0]==='search'){on('search');return viewSearch(qs.get('q')||'')}
 if(parts[0]==='marks'){on('marks');return viewMarks(parts[1]||'')}
 if(parts[0]==='data'){on('data');return viewData()}
 if(parts[0]==='month'){on('month');return viewMonth(parts[1]||'')}
 if(parts[0]==='account'){on('account');return viewAccount()}
 on('shelf');viewShelf();
}
const app=document.getElementById('app');

/* ---------- shelf ---------- */
const HUES=['#7c9a8a','#8e7fa8','#c08a5b','#5f86a8','#a86d5f'];
function bookStats(b){const bk=BYID[b];let r=0,ing=0,notes=0;bk.chapters.forEach((_,ci)=>{const c=chget(b,ci);if(c.s===2)r++;else if(c.s===1)ing++;notes+=(c.notes||[]).length+(c.refl?1:0)});
 return{read:r,ing,total:bk.chapters.length,pct:Math.round(r/bk.chapters.length*100),notes,hl:HLV().filter(h=>h.b===b).length}}
function continueTarget(b){const bk=BYID[b];let ci=UI.last[b];
 if(ci===undefined||ci>=bk.chapters.length){ci=bk.chapters.findIndex((_,i)=>chget(b,i).s!==2);if(ci<0)ci=0}
 const c=chget(b,ci);return c.bmn!=null?`#/b/${b}/${ci}/n/${c.bmn}`:`#/b/${b}/${ci}/${UI.lastTab==='m'?'m':'n'}`}
function viewShelf(){
 let h=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><div><h1 style="margin:0;font-size:24px">我的书架</h1><div class="muted small">进度按“已读”章节计算 · 记录保存在本机，登录后自动同步 · 公开版只含解读笔记</div></div>
 <div class="row" style="flex:1;max-width:420px"><input id="shelfq" placeholder="有问题？直接问，例如：如何做一对一" onkeydown="if(event.key==='Enter'&&this.value.trim())go('#/ask?q='+encodeURIComponent(this.value.trim()))"></div></div><div class="shelf">`;
 BOOKS.forEach((bk,i)=>{const s=bookStats(bk.id);const lc=UI.last[bk.id];
  h+=`<div class="card book"><div class="cover" style="background:${HUES[i%5]}"></div><h3>${esc(bk.title)}</h3><div class="muted small">${esc(bk.author)}</div>
  <div class="bar"><div style="width:${s.pct}%"></div></div><div class="small muted">已读 ${s.read}/${s.total} 章（${s.pct}%）${s.ing?` · 在读 ${s.ing}`:''} · 高亮 ${s.hl} · 笔记 ${s.notes}</div>
  ${lc!==undefined?`<div class="small muted" style="margin-top:4px">上次：${esc(shortT(chTitle(bk.id,lc)))}</div>`:''}
  <div class="row" style="margin-top:12px"><button class="primary" onclick="go(continueTarget('${bk.id}'))">${lc!==undefined||s.read?'继续阅读':'开始阅读'}</button><button onclick="go('#/b/${bk.id}')">目录</button><button class="ghost small" onclick="go('#/marks/${bk.id}')">我的标记</button></div></div>`});
 h+=`</div>`;
 const recent=[...QA].sort((a,b)=>b.ts-a.ts).slice(0,3);
 if(recent.length){h+=`<h2 class="sec">最近的提问</h2><div class="card">`+recent.map(r=>`<div class="item"><a href="#/ask" onclick="ASKLOAD='${r.id}'">${esc(r.q)}</a> <span class="muted small">${fmt(r.ts)} · 引用 ${r.quotes.length} 段</span></div>`).join('')+`</div>`}
 app.innerHTML=h;
}

/* ---------- book overview ---------- */
function tocHTML(b,cur){const bk=BYID[b];const s=bookStats(b);
 return `<div style="padding:4px 8px 8px"><a href="#/b/${b}" style="font-weight:600">《${esc(bk.title)}》</a><div class="bar"><div style="width:${s.pct}%"></div></div><div class="small muted">已读 ${s.read}/${s.total}（${s.pct}%）</div></div>`+
 bk.chapters.map((ch,ci)=>{const c=chget(b,ci);return `<div class="ch ${ci===cur?'on':''}" onclick="go('#/b/${b}/${ci}/${UI.lastTab||'n'}')"><span class="dot s${c.s}" title="${STATUS[c.s]}">${SDOT[c.s]}</span><span>${esc(ch.t)}${c.bmn!=null?' <span class="muted small">📍</span>':''}</span></div>`}).join('')}
function viewBook(b){const bk=BYID[b];need(b,0,'n').catch(()=>{});
 app.innerHTML=`<div class="layout"><aside class="toc" id="toc">${tocHTML(b,-1)}</aside><div class="reader">
 <button class="mobile-only small" onclick="document.getElementById('toc').classList.toggle('open')">☰ 目录</button>
 <div class="chead"><h1>《${esc(bk.full)}》</h1><div class="muted">${esc(bk.author)}</div></div>
 <div class="row" style="margin:12px 0"><button class="primary" onclick="go(continueTarget('${b}'))">继续阅读</button><button onclick="go('#/marks/${b}')">本书的标记</button><button onclick="go('#/search?q=')">搜索</button></div>
 <div class="content card">${bk.intro.join('')}</div></div></div>`;
}

/* ---------- chapter ---------- */
async function viewChapter(b,ci,tab,target,keep){
 const bk=BYID[b];if(!bk.chapters[ci])return go('#/b/'+b);
 const tok=++RTOK;
 if(tab!=='m'&&!hasData(b,ci,tab)){
  if(!keep)app.innerHTML=`<div class="layout"><aside class="toc" id="toc">${tocHTML(b,ci)}</aside><div class="reader"><div class="chead"><h1>${esc(bk.chapters[ci].t)}</h1></div>${loadingHTML('正在载入解读笔记…')}</div></div>`;
  try{await need(b,ci,tab)}catch(e){if(tok===RTOK)app.querySelector('.reader').insertAdjacentHTML('beforeend',errorHTML(e));return}
  if(tok!==RTOK)return;
 }
 const ch=bk.chapters[ci];const c=chget(b,ci);
 UI.last[b]=ci;UI.lastBook=b;if(tab!=='m')UI.lastTab=tab;save('ui',UI);
 CUR={b,ci,tab};
 const nn=(c.notes||[]).length+(c.refl?1:0)+HLV().filter(h=>h.b===b&&h.c===ci).length;
 let body='';
 if(tab==='n'){
  body=`<div class="small muted" style="margin:6px 0 4px">提示：点一下段落可设“读到这里”；选中文字可高亮、加注或提问。</div><div class="content notes" id="doc" data-src="n"></div><div id="docmore"></div>`;
 }else{
  body=myTab(b,ci);
 }
 app.innerHTML=`<div class="layout"><aside class="toc" id="toc">${tocHTML(b,ci)}</aside><div class="reader">
 <div class="row"><button class="mobile-only small" onclick="document.getElementById('toc').classList.toggle('open')">☰ 目录</button><a class="small muted" href="#/b/${b}">《${esc(bk.title)}》</a><span class="small muted">· 第 ${ci+1}/${bk.chapters.length} 节</span></div>
 <div class="chead"><h1>${esc(ch.t)}</h1>
 <div class="row"><div class="seg" id="seg">${STATUS.map((s,i)=>`<button class="${c.s===i?'on':''}" onclick="setStatus('${b}',${ci},${i})">${s}</button>`).join('')}</div>
 ${c.bmn!=null?`<button class="small" onclick="go('#/b/${b}/${ci}/n/${c.bmn}')">📍 跳到读到的位置</button>`:''}</div></div>
 <div class="tabs"><button class="${tab==='n'?'on':''}" onclick="go('#/b/${b}/${ci}/n')">解读笔记</button><button class="${tab==='m'?'on':''}" onclick="go('#/b/${b}/${ci}/m')">我的感悟与笔记${nn?` <span class="badge">${nn}</span>`:''}</button></div>
 ${body}
 <div class="pager">${ci>0?`<button onclick="go('#/b/${b}/${ci-1}/${tab}')">← ${esc(shortT(bk.chapters[ci-1].t))}</button>`:'<span></span>'}
 ${c.s!==2?`<button class="primary" onclick="setStatus('${b}',${ci},2);${ci+1<bk.chapters.length?`go('#/b/${b}/${ci+1}/${tab}')`:''}">标为已读${ci+1<bk.chapters.length?'，下一节':''}</button>`:''}
 ${ci+1<bk.chapters.length?`<button onclick="go('#/b/${b}/${ci+1}/${tab}')">${esc(shortT(bk.chapters[ci+1].t))} →</button>`:'<span></span>'}</div>
 </div></div>`;
 const doc=document.getElementById('doc');
 if(doc){
  if(tab==='n')doc.addEventListener('click',onParaClick);
  doc.addEventListener('click',onMarkClick);
  let t=target;if(t==null&&!keep&&tab==='n'&&c.bmn!=null)t=c.bmn;
  const arr=tab==='o'?ch.o:ch.n;const total=arr.length;
  const blk=i=>{if(tab==='n')return arr[i].replace(/^<(\w+)/,`<$1 data-b="${i}"`);const x=arr[i];return x[0]==='g'?`<p class="pg" data-b="${i}">${esc(x[1])}</p>`:x[0]==='h'?`<h3 data-b="${i}">${esc(x[1])}</h3>`:`<p data-b="${i}">${esc(x[1])}</p>`};
  let pos=0;
  const addUpTo=end=>{end=Math.min(end,total);if(end<=pos)return;let h='';for(let i=pos;i<end;i++)h+=blk(i);doc.insertAdjacentHTML('beforeend',h);paintHL(doc,b,ci,tab,pos,end);
   if(tab==='n'&&c.bmn!=null&&c.bmn>=pos&&c.bmn<end){const el=doc.querySelector(`[data-b="${c.bmn}"]`);el&&el.classList.add('bm')}pos=end};
  // first screen right away (and everything up to the jump target); the rest in small chunks so long chapters never freeze
  addUpTo(keep?total:Math.max(80,(t!=null?t+30:0)));
  const more=document.getElementById('docmore');
  const step=()=>{if(tok!==RTOK||!doc.isConnected)return;addUpTo(pos+120);if(pos<total){more.innerHTML=loadingHTML(`继续排版… ${pos}/${total} 段`);setTimeout(step,16)}else more.innerHTML=''};
  if(pos<total){more.innerHTML=loadingHTML(`继续排版… ${pos}/${total} 段`);setTimeout(step,16)}
  if(t!=null){const el=doc.querySelector(`[data-b="${t}"]`);if(el){setTimeout(()=>{if(tok!==RTOK)return;el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)},30)}}
 }
 if(tab==='m')bindMy(b,ci);
}
function setStatus(b,ci,s){chs(b,ci).s=s;save('ch',CH);const seg=document.getElementById('seg');if(seg)seg.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i===s));
 const toc=document.getElementById('toc');if(toc)toc.innerHTML=tocHTML(b,ci);toast('已标为「'+STATUS[s]+'」')}
function onParaClick(e){
 if(e.target.closest('mark.hl')||e.target.closest('.bmbtn'))return;
 const sel=window.getSelection();if(sel&&!sel.isCollapsed)return;
 const p=e.target.closest('[data-b]');if(!p||p.classList.contains('pg'))return;
 document.querySelectorAll('.bmbtn').forEach(x=>x.remove());
 const btn=document.createElement('button');btn.className='bmbtn small';btn.textContent='📍 读到这里';
 btn.onclick=ev=>{ev.stopPropagation();setBookmark(CUR.b,CUR.ci,+p.dataset.b);btn.remove()};
 p.appendChild(btn);setTimeout(()=>btn.remove(),4000);
}
function setBookmark(b,ci,blk){const c=chs(b,ci);c.bmn=blk;if(c.s===0)c.s=1;save('ch',CH);
 document.querySelectorAll('.bm').forEach(x=>x.classList.remove('bm'));const el=document.querySelector(`#doc [data-b="${blk}"]`);el&&el.classList.add('bm');
 const seg=document.getElementById('seg');if(seg)seg.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i===c.s));
 const toc=document.getElementById('toc');if(toc)toc.innerHTML=tocHTML(b,ci);toast('已记录：读到这里')}

/* ---------- my tab ---------- */
function myTab(b,ci){const c=chget(b,ci);const hls=HLV().filter(h=>h.b===b&&h.c===ci);
 return `<div class="content" style="max-width:760px">
 <h2 class="sec" style="margin-top:6px">感悟 <span class="saved" id="reflsaved"></span></h2>
 <textarea id="refl" placeholder="读完这一节，你最想记住什么？和你的工作、团队有什么联系？（自动保存）">${esc(c.refl||'')}</textarea>
 <h2 class="sec">笔记 <span class="muted small">（可写多条，带时间）</span></h2>
 <textarea id="newnote" placeholder="写一条笔记…"></textarea><div class="row" style="margin-top:6px"><button class="primary" id="addnote">添加笔记</button></div>
 <div id="notelist" class="card" style="margin-top:12px;${(c.notes||[]).length?'':'display:none'}">${noteListHTML(b,ci)}</div>
 <h2 class="sec">本节的高亮 <span class="muted small">${hls.length} 条</span></h2>
 ${hls.length?`<div class="card">${hls.map(hlItem).join('')}</div>`:'<div class="muted small">在「解读笔记」里选中文字即可高亮。</div>'}
 </div>`}
function noteListHTML(b,ci){const c=chget(b,ci);return [...(c.notes||[])].sort((x,y)=>y.ts-x.ts).map(n=>`<div class="item" data-n="${n.id}"><div class="small muted">${fmt(n.ts)}${n.ut&&n.ut!==n.ts?' · 修改于 '+fmt(n.ut):''}</div><div class="ntext" style="white-space:pre-wrap">${esc(n.text)}</div><div class="row" style="margin-top:4px"><button class="small" onclick="editNote('${b}',${ci},'${n.id}')">编辑</button><button class="small danger" onclick="delNote('${b}',${ci},'${n.id}')">删除</button></div></div>`).join('')}
function bindMy(b,ci){const r=document.getElementById('refl');let t;
 r.addEventListener('input',()=>{clearTimeout(t);document.getElementById('reflsaved').textContent='…';t=setTimeout(()=>{const c=chs(b,ci);c.refl=r.value;if(c.s===0&&r.value.trim())c.s=1;save('ch',CH);document.getElementById('reflsaved').textContent='已保存 '+fmt(Date.now()).slice(11)},400)});
 document.getElementById('addnote').onclick=()=>{const v=document.getElementById('newnote').value.trim();if(!v)return;const c=chs(b,ci);c.notes=c.notes||[];const ts=Date.now();c.notes.push({id:uid(),ts,ut:ts,text:v});if(c.s===0)c.s=1;save('ch',CH);document.getElementById('newnote').value='';const nl=document.getElementById('notelist');nl.style.display='';nl.innerHTML=noteListHTML(b,ci);toast('笔记已添加')}}
function editNote(b,ci,id){const c=chs(b,ci);const n=c.notes.find(x=>x.id===id);if(!n)return;
 modal(`<h3 style="margin-top:0">编辑笔记</h3><textarea id="mtext" style="min-height:160px">${esc(n.text)}</textarea><div class="row" style="margin-top:10px;justify-content:flex-end"><button onclick="closeModal()">取消</button><button class="primary" id="mok">保存</button></div>`);
 document.getElementById('mok').onclick=()=>{n.text=document.getElementById('mtext').value;n.ut=Date.now();save('ch',CH);closeModal();const nl=document.getElementById('notelist');if(nl)nl.innerHTML=noteListHTML(b,ci);toast('已保存')}}
function delNote(b,ci,id){if(!confirm('删除这条笔记？'))return;const c=chs(b,ci);c.notes=c.notes.filter(x=>x.id!==id);save('ch',CH);const nl=document.getElementById('notelist');if(nl)nl.innerHTML=noteListHTML(b,ci);toast('已删除')}
function modal(html){closeModal();const d=document.createElement('div');d.className='pop';d.id='modal';d.innerHTML=`<div class="card">${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeModal()});document.body.appendChild(d);const ta=d.querySelector('textarea');ta&&ta.focus()}
function closeModal(){const m=document.getElementById('modal');m&&m.remove()}

/* ---------- highlights ---------- */
function textOffset(block,node,off){const r=document.createRange();r.setStart(block,0);r.setEnd(node,off);return r.toString().length}
function wrapRange(block,start,end,mk){
 const walker=document.createTreeWalker(block,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('.bmbtn')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 let pos=0,n;const todo=[];
 while(n=walker.nextNode()){const L=n.nodeValue.length;const s=Math.max(start,pos),e=Math.min(end,pos+L);if(s<e)todo.push([n,s-pos,e-pos]);pos+=L;if(pos>=end)break}
 todo.forEach(([n,s,e])=>{let mid=n;if(s>0)mid=n.splitText(s);if(e-s<mid.nodeValue.length)mid.splitText(e-s);const m=mk();mid.parentNode.insertBefore(m,mid);m.appendChild(mid)});
}
function paintHL(doc,b,ci,src,from,to){if(from==null){from=0;to=1e9}HL.filter(h=>h.b===b&&h.c===ci&&h.src===src&&h.blk>=from&&h.blk<to).sort((x,y)=>x.start-y.start).forEach(h=>{const blk=doc.querySelector(`[data-b="${h.blk}"]`);if(!blk)return;
 wrapRange(blk,h.start,h.end,()=>{const m=document.createElement('mark');m.className='hl c-'+h.color+(h.note?' has-note':'');m.dataset.h=h.id;if(h.note)m.title=h.note;return m})})}
let SEL=null;const tool=document.getElementById('seltool');
function hideSel(){tool.style.display='none';SEL=null}
document.addEventListener('selectionchange',()=>{clearTimeout(document._st);document._st=setTimeout(checkSel,220)});
function checkSel(){const s=window.getSelection();if(!s||s.isCollapsed||!s.rangeCount){if(!tool.matches(':hover'))hideSel();return}
 const r=s.getRangeAt(0);const doc=document.getElementById('doc');if(!doc||!doc.contains(r.commonAncestorContainer)){hideSel();return}
 const sn=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;let blk=sn.closest('[data-b]');
 if(!blk){hideSel();return}
 let endNode=r.endContainer,endOff=r.endOffset;if(!blk.contains(endNode)){endNode=blk;endOff=blk.childNodes.length}
 const start=textOffset(blk,r.startContainer,r.startOffset),end=textOffset(blk,endNode,endOff);
 const text=blk.textContent.slice(start,end).replace(/📍 读到这里/g,'');if(!text.trim()){hideSel();return}
 SEL={b:CUR.b,c:CUR.ci,src:doc.dataset.src,blk:+blk.dataset.b,start,end,text:text.trim()};
 const rect=r.getBoundingClientRect();tool.style.display='flex';
 const top=window.scrollY+rect.top-48;tool.style.top=(top<window.scrollY+56?window.scrollY+rect.bottom+8:top)+'px';
 tool.style.left=Math.max(8,Math.min(window.scrollX+rect.left,window.scrollX+document.documentElement.clientWidth-tool.offsetWidth-8))+'px';}
tool.addEventListener('mousedown',e=>e.preventDefault());
tool.addEventListener('click',e=>{if(!SEL)return;const c=e.target.dataset.c,act=e.target.dataset.act;
 if(c){addHL(SEL,c,'');}
 else if(act==='note'){const s=SEL;modal(`<h3 style="margin-top:0">高亮并加注</h3><div class="quote small">${esc(s.text)}</div><div class="row" style="margin:8px 0">${Object.keys(COLORS).map(k=>`<label><input type="radio" name="hc" value="${k}" ${k==='y'?'checked':''} style="width:auto"> <span class="swatch c-${k}"></span></label>`).join(' ')}</div><textarea id="mtext" placeholder="写下你的注释…"></textarea><div class="row" style="margin-top:10px;justify-content:flex-end"><button onclick="closeModal()">取消</button><button class="primary" id="mok">保存</button></div>`);
  document.getElementById('mok').onclick=()=>{const col=document.querySelector('input[name=hc]:checked').value;addHL(s,col,document.getElementById('mtext').value.trim());closeModal()}}
 else if(act==='ask'){const s=SEL;hideSel();window.getSelection().removeAllRanges();ASK={id:null,q:'',b:s.b,c:s.c,quote:s.text,quotes:[{b:s.b,c:s.c,src:s.src,blk:s.blk,text:s.text}],answer:''};ASKKEEP=true;go('#/ask')}
});
function addHL(s,color,note){const h={id:uid(),b:s.b,c:s.c,src:s.src,blk:s.blk,start:s.start,end:s.end,text:s.text,color,note,ts:Date.now()};
 HL.push(h);save('hl',HL);const cc=chs(s.b,s.c);if(cc.s===0){cc.s=1;save('ch',CH)}
 window.getSelection().removeAllRanges();hideSel();
 const doc=document.getElementById('doc');const blk=doc&&doc.querySelector(`[data-b="${s.blk}"]`);
 if(blk)wrapRange(blk,h.start,h.end,()=>{const m=document.createElement('mark');m.className='hl c-'+color+(note?' has-note':'');m.dataset.h=h.id;if(note)m.title=note;return m});
 toast(note?'已高亮并保存注释':'已高亮')}
function onMarkClick(e){const m=e.target.closest('mark.hl');if(!m)return;const s=window.getSelection();if(s&&!s.isCollapsed)return;e.stopPropagation();openHL(m.dataset.h)}
function openHL(id){const h=HL.find(x=>x.id===id);if(!h)return;
 modal(`<h3 style="margin-top:0">我的标记</h3><div class="small muted">《${esc(BYID[h.b].title)}》${esc(chTitle(h.b,h.c))} · 解读笔记 · ${fmt(h.ts)}</div><div class="quote c-${h.color}">${esc(h.text)}</div>
 <div class="row" style="margin:8px 0">颜色：${Object.keys(COLORS).map(k=>`<span class="swatch c-${k}" onclick="recolor('${id}','${k}')" style="${k===h.color?'box-shadow:0 0 0 2px var(--accent)':''}"></span>`).join(' ')}</div>
 <textarea id="mtext" placeholder="注释（可选）">${esc(h.note||'')}</textarea>
 <div class="row" style="margin-top:10px;justify-content:space-between"><div class="row"><button class="small danger" onclick="delHL('${id}')">删除标记</button><button class="small" onclick="copyText(quoteFmt('${h.b}',${h.c},HL.find(x=>x.id==='${id}').text)).then(ok=>toast(ok?'引用已复制':'复制失败'))">复制引用</button></div><div class="row"><button onclick="closeModal()">关闭</button><button class="primary" onclick="saveHLNote('${id}')">保存注释</button></div></div>`)}
function recolor(id,c){const h=HL.find(x=>x.id===id);h.color=c;save('hl',HL);closeModal();refreshAfterHL()}

async function doAsk(){const box=document.getElementById('askres');if(!ASK.q){box.innerHTML='';return}

 if(tok!==RTOK||!document.getElementById('askres'))return;

 box.innerHTML=`<h2 class="sec">解读笔记中的相关内容 <span class="muted small">${ASKRES.length} 段 · ${ms} ms</span></h2>`+(ASKRES.length?`<div class="card">${ASKRES.map((r,i)=>{const d=r.d;return `<div class="item"><div class="small muted">${i+1}. 《${esc(BYID[d.b].title)}》${esc(chTitle(d.b,d.c))}</div><div class="quote">${snippet(d.t,r.hits,320)}</div>

 ASK.b=d.b;ASK.c=d.c;ASK.quote=d.t;ASK.quotes=[{b:d.b,c:d.c,src:'n',blk:d.blk,text:d.t}];
 const g=id=>document.getElementById(id);g('askb').value=d.b;g('askc').innerHTML=chapOpts(d.b,d.c);g('askquote').value=d.t;
 copyText(quoteFmt(d.b,d.c,d.t)).then(ok=>toast(ok?'已引用，并复制到剪贴板':'已引用'));
 if(btn){btn.textContent='已引用 ✓';btn.classList.remove('primary')}}
function askMsg(){const bk=ASK.b&&BYID[ASK.b];const ch=bk&&ASK.c!=null&&bk.chapters[ASK.c]?bk.chapters[ASK.c].t:'';
 let m=`Borges，我在读书时有个问题：\n`;if(bk)m+=`\n《${bk.title}》${ch?' · '+ch:''}\n`;
 if(ASK.quote)m+=`\n引文（解读笔记）：\n> ${ASK.quote.length>600?ASK.quote.slice(0,600)+'…':ASK.quote}\n`;
 m+=`\n问题：${ASK.q}\n`;if(ASK.answer&&ASK.answer.trim())m+=`\n我自己的初步想法：\n${ASK.answer.trim()}\n`;

function recordAsk(status){const now=Date.now();
 const rec={q:ASK.q,b:ASK.b||'',c:ASK.c,quote:ASK.quote||'',quotes:ASK.quotes&&ASK.quotes.length?ASK.quotes:(ASK.quote&&ASK.b&&ASK.c!=null?[{b:ASK.b,c:ASK.c,src:'n',blk:null,text:ASK.quote}]:[]),answer:ASK.answer||'',status};

 if(ASK.id){const i=QA.findIndex(x=>x.id===ASK.id);if(i>=0){Object.assign(QA[i],rec,{ut:now})}else QA.push(Object.assign({id:ASK.id,ts:now},rec))}
 else{ASK.id=uid();QA.push(Object.assign({id:ASK.id,ts:now},rec))}

async function copyFallback(reason){const m=askMsg();const ok=await copyText(m);recordAsk('已复制');

async function sendBorges(){readAsk();if(!ASK.q){toast('先写下问题');return}

 if(!CFG.url)return copyFallback('还没有设置 Webhook（在「设置」里填写）');

 const headers={'Content-Type':'application/json'};if(CFG.auth)headers['Authorization']=CFG.auth;

  if(!r.ok)throw new Error('服务器返回 '+r.status);
  recordAsk('已发送');showSend(true,'已发给 Borges，答案会出现在 Grok Bot 聊天里');toast('已发给 Borges')}
 catch(e){await copyFallback('发送失败（'+(e.name==='AbortError'?'超时':e.name==='TypeError'?'网络错误，或被浏览器的跨域（CORS）规则拦截':(e.message||'未知错误'))+'）')}
 finally{clearTimeout(tm);if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='发给 Borges'}}}

function viewSearch(q){
 app.innerHTML=`<div style="max-width:860px"><h1 style="margin:0 0 8px;font-size:24px">全局搜索</h1>
 <div class="row"><input id="sq" value="${esc(q)}" placeholder="搜索解读笔记、我的高亮与笔记（空格分隔多个词）" style="flex:1"><button class="primary" id="sgo">搜索</button></div><div id="sres" style="margin-top:12px"></div></div>`;
 const inp=document.getElementById('sq');const run=()=>{const v=inp.value.trim();history.replaceState(null,'','#/search?q='+encodeURIComponent(v));doSearch(v)};

async function doSearch(q){const el=document.getElementById('sres');if(!q){el.innerHTML='';return}
 const tok=++RTOK;try{await ensureDocs(null,el)}catch(e){el.innerHTML=errorHTML(e);return}
 if(tok!==RTOK||!document.getElementById('sres'))return;
 let res=exactSearch(q,200);let mode='精确匹配';if(!res.length){res=rank(q,{limit:30});mode='相关度排序（无精确匹配）'}
 const lq=q.toLowerCase().split(/\s+/).filter(Boolean);
 const mine=[];HLV().forEach(h=>{const t=(h.text+' '+(h.note||'')).toLowerCase();if(lq.every(x=>t.includes(x)))mine.push(h)});
 const mynotes=[];BOOKS.forEach(bk=>bk.chapters.forEach((_,ci)=>{const c=chget(bk.id,ci);[c.refl,...(c.notes||[]).map(n=>n.text)].forEach(t=>{if(t&&lq.every(x=>t.toLowerCase().includes(x)))mynotes.push({b:bk.id,ci,t})})}));
 const groups={};res.forEach(r=>{const k=r.d.b;(groups[k]=groups[k]||[]).push(r)});
 el.innerHTML=`<div class="small muted">${mode} · 书中 ${res.length}${res.length>=200?'+':''} 处 · 我的标记 ${mine.length} · 我的笔记 ${mynotes.length}</div>`+
 (mine.length||mynotes.length?`<h2 class="sec">我的标记与笔记</h2><div class="card">${mine.map(hlItem).join('')}${mynotes.map(n=>`<div class="item"><div class="small muted">${esc(BYID[n.b].title)} · ${esc(shortT(chTitle(n.b,n.ci)))} · 我的笔记</div><div>${snippet(n.t,lq,200)}</div><button class="small" onclick="go('#/b/${n.b}/${n.ci}/m')">打开</button></div>`).join('')}</div>`:'')+
 Object.keys(groups).map(b=>`<h2 class="sec">《${esc(BYID[b].title)}》 <span class="muted small">${groups[b].length} 处</span></h2><div class="card">${groups[b].slice(0,40).map(r=>`<div class="item"><div class="small muted">${esc(chTitle(r.d.b,r.d.c))} · 解读笔记</div><div>${snippet(r.d.t,r.hits,220)}</div><button class="small" onclick="go('#/b/${r.d.b}/${r.d.c}/${r.d.src}/${r.d.blk}')">跳转</button></div>`).join('')}${groups[b].length>40?`<div class="small muted">还有 ${groups[b].length-40} 处，换更具体的词试试</div>`:''}</div>`).join('');
}

 if(mode==='replace'){CH=d.ch||{};HL=d.hl||[];QA=d.qa||[];if(d.ui)UI=Object.assign(UI,d.ui)}
 else{for(const k in (d.ch||{})){const a=CH[k],b=d.ch[k];if(!a){CH[k]=b;continue}a.s=Math.max(a.s||0,b.s||0);if(a.bm==null)a.bm=b.bm;if(a.bmn==null)a.bmn=b.bmn;if(b.refl&&b.refl!==a.refl)a.refl=a.refl?(a.refl.includes(b.refl)?a.refl:a.refl+'\n\n'+b.refl):b.refl;const ids=new Set((a.notes||[]).map(x=>x.id));a.notes=(a.notes||[]).concat((b.notes||[]).filter(x=>!ids.has(x.id)))}
  const hid=new Set(HL.map(x=>x.id));HL=HL.concat((d.hl||[]).filter(x=>!hid.has(x.id)));const qid=new Set(QA.map(x=>x.id));QA=QA.concat((d.qa||[]).filter(x=>!qid.has(x.id)))}
 saveAll();importExtra(d,mode);applyTheme();toast('导入成功（'+(mode==='replace'?'覆盖':'合并')+'）');viewData()}catch(e){alert('导入失败：'+e.message)}};fr.readAsText(file)}

/* ===== Borges add-on: auto progress, reading log, 月度, account + sync (shared by site & full app) ===== */
const SYNC_DEFAULT_API='https://borges-sync.gordonhua.workers.dev';
const DEV=(()=>{let d=load('dev',null);if(!d){d=Math.random().toString(36).slice(2,8);save('dev',d)}return d})();
let LOG=load('log',{}),POS=load('pos',{});
let SY=load('sync',{});  /* {api,token,phone,role,rev,last,lastPhone} — local only, never exported */
let META=load('meta',{t:{},p:{}});if(!META.t)META.t={};if(!META.p)META.p={};
function dayKey(ts){const d=new Date(ts||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function syncApi(){return (SY.api||(SYNC_DEFAULT_API.indexOf('__')===0?'':SYNC_DEFAULT_API)).replace(/\/+$/,'')}

/* ---- synced kinds: how to read / write each store item by item ---- */
const KINDS={
 ch:{get:()=>CH,set:v=>{CH=v},type:'obj',sk:'ch'},
 hl:{get:()=>HL,set:v=>{HL=v},type:'arr',sk:'hl'},
 qa:{get:()=>QA,set:v=>{QA=v},type:'arr',sk:'qa'},
 log:{get:()=>LOG,set:v=>{LOG=v},type:'obj',sk:'log'},
 pos:{get:()=>POS,set:v=>{POS=v},type:'obj',sk:'pos'},
 ui:{get:()=>({last:{v:{last:UI.last||{},lastBook:UI.lastBook||null}}}),type:'ui',sk:'ui'}
};
const SK2KIND={ch:'ch',hl:'hl',qa:'qa',log:'log',pos:'pos',ui:'ui'};
function entries(kind){const K=KINDS[kind],s=K.get();
 if(K.type==='arr')return s.map(x=>[x.id,x]);
 if(K.type==='ui')return [['last',s.last.v]];
 return Object.keys(s).map(k=>[k,s[k]])}
const SHADOW={};
function snap(kind){const m=new Map();entries(kind).forEach(([k,v])=>m.set(k,JSON.stringify(v)));return m}
function hintTs(kind,v){return (v&&(v.ut||v.ts||v.dt))||1}
/* initialise: items that existed before sync was added get a timestamp so they can be uploaded */
Object.keys(KINDS).forEach(kind=>{SHADOW[kind]=snap(kind);SHADOW[kind].forEach((js,k)=>{const id=kind+'\u0001'+k;if(!META.t[id])META.t[id]=hintTs(kind,JSON.parse(js))})});
const _rawSave=save;
function saveMeta(){_rawSave('meta',META)}
saveMeta();
function detect(kind){const now=Date.now(),old=SHADOW[kind],cur=snap(kind);let ch=false;
 cur.forEach((js,k)=>{if(old.get(k)!==js){META.t[kind+'\u0001'+k]=now;ch=true}});
 old.forEach((_,k)=>{if(!cur.has(k)){META.t[kind+'\u0001'+k]=-now;ch=true}}); /* negative ts = deleted (tombstone) */
 SHADOW[kind]=cur;if(ch){saveMeta();schedulePush()}}
save=function(k,v){_rawSave(k,v);if(SK2KIND[k])detect(SK2KIND[k])};

/* ---- reading log ---- */
function logDay(){const k=dayKey()+'|'+DEV;if(!LOG[k])LOG[k]={sec:{},open:[],done:[]};const e=LOG[k];e.sec=e.sec||{};e.open=e.open||[];e.done=e.done||[];return e}
function logOpen(b,ci){const e=logDay(),k=b+'|'+ci;if(!e.open.includes(k)){e.open.push(k);save('log',LOG)}}
function logDone(b,ci){const e=logDay(),k=b+'|'+ci;if(!e.done.includes(k)){e.done.push(k);save('log',LOG)}}
let LAST_ACT=Date.now(),VISIT=null,LOG_DIRTY=0;
['scroll','keydown','pointerdown','touchstart','wheel','mousemove'].forEach(ev=>window.addEventListener(ev,()=>{LAST_ACT=Date.now()},{passive:true}));
setInterval(()=>{
 if(document.visibilityState!=='visible'||!VISIT||Date.now()-LAST_ACT>120000)return;
 if(!/^#\/b\/[^/]+\/\d+/.test(location.hash))return;
 const e=logDay();e.sec[VISIT.b]=(e.sec[VISIT.b]||0)+5;VISIT.dwell+=5;LOG_DIRTY+=5;
 if(LOG_DIRTY>=30){LOG_DIRTY=0;save('log',LOG)}

},5000);

/* ---- auto position ---- */
function hdrH(){const h=document.querySelector('header.top');return h?h.offsetHeight:0}
function blocksOf(doc){return doc.children}
function topBlock(doc){const kids=blocksOf(doc),H=hdrH()+4;let lo=0,hi=kids.length-1,ans=-1;
 while(lo<=hi){const m=(lo+hi)>>1,r=kids[m].getBoundingClientRect();if(r.bottom>H){ans=m;hi=m-1}else lo=m+1}
 if(ans<0)return null;const el=kids[ans];const b=el.getAttribute('data-b');if(b==null)return null;return{blk:+b,off:Math.round(H-el.getBoundingClientRect().top)}}
let POS_T=0;
function savePos(force){if(!VISIT||VISIT.restoring||CUR.b!==VISIT.b||CUR.ci!==VISIT.ci||CUR.tab!==VISIT.tab)return;const doc=document.getElementById('doc');if(!doc)return;
 const now=Date.now();if(!force&&now-POS_T<1500){clearTimeout(savePos._h);savePos._h=setTimeout(()=>savePos(true),1600);return}POS_T=now;
 const t=topBlock(doc);if(!t)return;const k=VISIT.b+'|'+VISIT.ci+'|'+VISIT.tab;const p=POS[k];
 if(p&&p.blk===t.blk&&Math.abs((p.off||0)-t.off)<40)return;
 POS[k]={blk:t.blk,off:Math.max(0,t.off),ts:now};save('pos',POS)}
function lastPos(b,ci){let best=null;['n','o'].forEach(tab=>{const p=POS[b+'|'+ci+'|'+tab];if(p&&(!best||p.ts>best.ts))best=Object.assign({tab},p)});return best}
function restorePos(b,ci,tab,tok){const p=POS[b+'|'+ci+'|'+tab];if(!p)return;const c=chget(b,ci);
 if(c.bmt&&c.bmt>p.ts&&tab==='o')return; /* a newer manual 📍 wins */
 VISIT.restoring=true;let n=0;
 const tryIt=()=>{if(tok!==RTOK){return}const el=document.querySelector(`#doc > [data-b="${p.blk}"]`);
  if(el){const y=el.getBoundingClientRect().top+window.scrollY-hdrH()-4+(p.off||0);window.scrollTo(0,Math.max(0,y));setTimeout(()=>{VISIT&&(VISIT.restoring=false)},400);return}
  if(++n<80)setTimeout(tryIt,100);else VISIT.restoring=false};
 setTimeout(tryIt,60)}
window.addEventListener('hashchange',()=>{if(!/^#\/b\/[^/]+\/\d+/.test(location.hash)){savePos(true);VISIT=null}});
window.addEventListener('scroll',()=>{if(!VISIT)return;savePos(false);checkEnd()},{passive:true});
function checkEnd(){if(!VISIT||VISIT.restoring||VISIT.noAuto||VISIT.tab==='m')return;
 const doc=document.getElementById('doc'),more=document.getElementById('docmore');if(!doc||(more&&more.innerHTML))return;
 if(VISIT.dwell<10)return;
 const last=doc.lastElementChild;const vh=window.innerHeight;
 const atEnd=(last&&last.getBoundingClientRect().bottom<=vh+40)||((window.scrollY+vh)/Math.max(1,document.documentElement.scrollHeight)>=0.95&&document.documentElement.scrollHeight>vh*1.2);
 if(!atEnd)return;const c=chget(VISIT.b,VISIT.ci);if(c.s===2){VISIT.noAuto=true;return}
 AUTO_ST=true;try{setStatus(VISIT.b,VISIT.ci,2)}finally{AUTO_ST=false}VISIT.noAuto=true;
 const pg=document.querySelector('.pager button.primary');if(pg&&/标为已读/.test(pg.textContent))pg.remove();
 toast('读到章末，已自动标为「已读」')}

const _viewChapter=viewChapter;
viewChapter=async function(b,ci,tab,target,keep){
 const r=await _viewChapter.apply(this,arguments);
 if(keep)return r;
 if(!(CUR.b===b&&CUR.ci===ci&&CUR.tab===tab)||!document.getElementById('seg'))return r;
 const tok=RTOK;
 VISIT={b,ci,tab,dwell:0,noAuto:false,restoring:false};
 if(tab!=='m'){const c=chs(b,ci);
  if(c.s===0){c.s=1;save('ch',CH);const seg=document.getElementById('seg');if(seg)seg.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i===1));const toc=document.getElementById('toc');if(toc)toc.innerHTML=tocHTML(b,ci)}
  logOpen(b,ci);
  if(target==null)restorePos(b,ci,tab,tok)}
 return r};
const _continueTarget=continueTarget;
continueTarget=function(b){const t=_continueTarget(b);const m=/^#\/b\/([^/]+)\/(\d+)\//.exec(t);if(!m)return t;const ci=+m[2];const p=lastPos(b,ci);
 if(!p)return t;if(typeof hasTab==='function'&&!hasTab(p.tab))return t;const c=chget(b,ci);if(p.tab==='o'&&c.bmt&&c.bmt>p.ts)return t;
 return `#/b/${b}/${ci}/${p.tab}`};
function hasTab(t){return t==='n'||(t==='o'&&BOOKS.some(b=>b.parts&&b.parts.length))}

/* ---- 月度 ---- */
function monthKey(ts){return dayKey(ts).slice(0,7)}
function monthStats(mk){const days={};let sec=0;const per={};
 const P=b=>per[b]||(per[b]={sec:0,ch:0,done:false});
 Object.keys(LOG).forEach(k=>{const day=k.split('|')[0];if(day.slice(0,7)!==mk)return;const e=LOG[k];const d=days[day]||(days[day]={sec:0,ch:0,open:0});
  Object.keys(e.sec||{}).forEach(b=>{if(!BYID[b])return;d.sec+=e.sec[b];sec+=e.sec[b];P(b).sec+=e.sec[b]});d.open+=(e.open||[]).length});
 let chDone=0;Object.keys(CH).forEach(k=>{const c=CH[k];if(c.s!==2||!c.dt||monthKey(c.dt)!==mk)return;const [b]=k.split('|');if(!BYID[b])return;chDone++;P(b).ch++;const d=dayKey(c.dt);(days[d]||(days[d]={sec:0,ch:0,open:0})).ch++});
 const books=[];BOOKS.forEach(bk=>{let all=true,mx=0;bk.chapters.forEach((_,ci)=>{const c=chget(bk.id,ci);if(c.s!==2)all=false;else mx=Math.max(mx,c.dt||0)});if(all&&mx&&monthKey(mx)===mk){books.push(bk.id);P(bk.id).done=true}});
 const rdays=Object.keys(days).filter(d=>days[d].sec>0||days[d].ch>0||days[d].open>0).length;
 return{days,sec,chDone,books,rdays,per}}
function allMonths(){const s=new Set([monthKey()]);Object.keys(LOG).forEach(k=>s.add(k.slice(0,7)));Object.values(CH).forEach(c=>{if(c.dt)s.add(monthKey(c.dt))});return [...s].sort()}
function shiftMonth(mk,d){let [y,m]=mk.split('-').map(Number);m+=d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}
function mins(sec){return Math.round(sec/60)}
function viewMonth(mk){if(!/^\d{4}-\d{2}$/.test(mk||''))mk=monthKey();const S=monthStats(mk);const [y,m]=mk.split('-').map(Number);const nd=new Date(y,m,0).getDate();
 const mx=Math.max(1,...Object.values(S.days).map(d=>d.sec));const today=dayKey();
 let bars='';for(let i=1;i<=nd;i++){const dk=mk+'-'+String(i).padStart(2,'0');const d=S.days[dk]||{sec:0,ch:0};const h=d.sec?Math.max(4,Math.round(d.sec/mx*100)):0;
  bars+=`<div class="mbar${dk===today?' today':''}" title="${m}月${i}日：约 ${mins(d.sec)} 分钟${d.ch?`，读完 ${d.ch} 章`:''}"><div class="mcol"><div style="height:${h}%"></div></div>${d.ch?`<span class="mdot">${d.ch}</span>`:''}<span class="mlab">${i===1||i%5===0?i:''}</span></div>`}
 const rows=BOOKS.filter(bk=>S.per[bk.id]).map(bk=>{const p=S.per[bk.id],st=bookStats(bk.id);return `<tr><td><a href="#/b/${bk.id}">《${esc(bk.title)}》</a>${p.done?' <span class="badge">本月读完</span>':''}</td><td>${p.ch}</td><td>${mins(p.sec)}</td><td>${st.read}/${st.total}</td></tr>`}).join('');
 const months=allMonths();
 app.innerHTML=`<div style="max-width:820px"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h1 style="margin:0;font-size:24px">月度阅读</h1>
 <div class="row"><button class="small" onclick="go('#/month/${shiftMonth(mk,-1)}')">‹ 上月</button><select id="msel" style="width:auto" onchange="go('#/month/'+this.value)">${(months.includes(mk)?months:[...months,mk].sort()).map(x=>`<option value="${x}" ${x===mk?'selected':''}>${x.replace('-','年')}月</option>`).join('')}</select><button class="small" onclick="go('#/month/${shiftMonth(mk,1)}')">下月 ›</button></div></div>
 <div class="mstats"><div class="card"><b>${S.chDone}</b><span>读完章节</span></div><div class="card"><b>${S.books.length}</b><span>读完的书</span></div><div class="card"><b>${S.rdays}</b><span>阅读天数</span></div><div class="card"><b>${mins(S.sec)}</b><span>阅读分钟（约）</span></div></div>
 <div class="card" style="margin-top:14px"><h3 style="margin-top:0">每天阅读时长</h3><div class="mchart">${bars}</div><div class="small muted" style="margin-top:6px">柱高 = 当天阅读分钟（页面在前台、2 分钟内有操作才计时）；数字 = 当天读完的章节数</div></div>
 <div class="card" style="margin-top:14px"><h3 style="margin-top:0">各书情况</h3>${rows?`<table class="mtab"><tr><th>书</th><th>本月读完章节</th><th>本月分钟</th><th>总进度</th></tr>${rows}</table>`:'<div class="muted small">这个月还没有阅读记录。</div>'}</div>
 ${S.books.length?`<div class="notice" style="margin-top:14px">🎉 本月读完：${S.books.map(b=>'《'+esc(BYID[b].title)+'》').join('、')}</div>`:''}
 <div class="small muted" style="margin-top:10px">记录${SY.token?'已随账号在各设备间同步':'只保存在本机（登录账号后可在手机和电脑间同步）'}。</div></div>`}

 else{const L=d.log||{};Object.keys(L).forEach(k=>{const a=LOG[k],b=L[k];if(!a){LOG[k]=b;return}const sec=Object.assign({},a.sec||{});Object.keys(b.sec||{}).forEach(x=>sec[x]=Math.max(sec[x]||0,b.sec[x]));
   LOG[k]={sec,open:[...new Set([...(a.open||[]),...(b.open||[])])],done:[...new Set([...(a.done||[]),...(b.done||[])])]}});

/* ---- network ---- */
const NAB=window.BorgesAndroid||null;const REQCB={};
window.__androidReqDone=function(id,code,text,err){const f=REQCB[id];delete REQCB[id];f&&f(code,text,err)};
function api(path,body,opt){opt=opt||{};const base=opt.base||syncApi();if(!base)return Promise.reject(new Error('还没有设置同步服务器'));
 const url=base+path,method=body===undefined?'GET':'POST';const headers={'Content-Type':'application/json'};const tok=opt.token!==undefined?opt.token:SY.token;if(tok)headers.Authorization='Bearer '+tok;
 const data=body===undefined?null:JSON.stringify(body);
 const parse=(code,text)=>{let j=null;try{j=JSON.parse(text)}catch(e){}if(code>=200&&code<300&&j&&j.ok!==false)return j;const e=new Error((j&&j.error)||('服务器返回 '+code));e.status=code;e.code=j&&j.code;throw e};
 if(NAB&&NAB.request&&!opt.keepalive)return new Promise((res,rej)=>{const id=uid();const tm=setTimeout(()=>{delete REQCB[id];rej(new Error('网络超时'))},30000);
  REQCB[id]=(code,text,err)=>{clearTimeout(tm);if(err&&!code)return rej(new Error('网络不可用：'+err));try{res(parse(code,text))}catch(e){rej(e)}};
  NAB.request(method,url,JSON.stringify(headers),data||'',id)});
 const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),30000);
 return fetch(url,{method,headers,body:data,keepalive:!!opt.keepalive,signal:opt.keepalive?undefined:ctl.signal}).then(async r=>{clearTimeout(tm);return parse(r.status,await r.text())},e=>{clearTimeout(tm);throw new Error('网络不可用')})}

/* ---- sync ---- */
let PUSH_T=null,SYNCING=null,SYNC_ERR='';
function schedulePush(){if(!SY.token)return;clearTimeout(PUSH_T);PUSH_T=setTimeout(()=>syncNow(false),4000)}
function dirtyItems(){const out=[];Object.keys(META.t).forEach(id=>{const t=META.t[id];if(META.p[id]===t)return;const [kind,k]=id.split('\u0001');if(!KINDS[kind])return;
  if(t<0){out.push({kind,k,del:true,ts:-t});return}const v=SHADOW[kind].get(k);if(v===undefined)return;out.push({kind,k,v:JSON.parse(v),ts:t})});return out}
function mergeCh(a,b){const r=Object.assign({},a,b);r.s=Math.max(a.s||0,b.s||0);const dts=[a.dt,b.dt].filter(Boolean);r.dt=r.s===2&&dts.length?Math.min(...dts):undefined;
 if(a.refl&&b.refl&&a.refl!==b.refl)r.refl=a.refl.includes(b.refl)?a.refl:b.refl.includes(a.refl)?b.refl:a.refl+'\n\n'+b.refl;else r.refl=a.refl||b.refl||'';
 const m=new Map();[...(a.notes||[]),...(b.notes||[])].forEach(n=>{const o=m.get(n.id);if(!o||(n.ut||n.ts)>(o.ut||o.ts))m.set(n.id,n)});r.notes=[...m.values()];
 if(r.dt===undefined)delete r.dt;return r}
function applyRemote(items){const touched=new Set();let conflictTs=Date.now();
 items.forEach(it=>{const K=KINDS[it.kind];if(!K)return;const id=it.kind+'\u0001'+it.k;const lt=Math.abs(META.t[id]||0);
  const dirty=META.t[id]!==undefined&&META.p[id]!==META.t[id];
  /* chapter edited here AND elsewhere since the last sync: keep both (notes union, highest status) */
  if(dirty&&!it.del&&it.kind==='ch'&&CH[it.k]&&it.ts!==lt){const cur=JSON.stringify(CH[it.k]);if(cur!==JSON.stringify(it.v)){const v=mergeCh(CH[it.k],it.v);CH[it.k]=v;SHADOW.ch.set(it.k,JSON.stringify(v));META.t[id]=Math.max(lt,it.ts)+1;touched.add('ch');return}}
  if(dirty&&!it.del&&it.kind==='ui'&&it.v){const loc={last:UI.last||{},lastBook:UI.lastBook||null};const v={last:Object.assign({},it.v.last||{},loc.last),lastBook:loc.lastBook||it.v.lastBook||null};if(JSON.stringify(v)!==JSON.stringify(it.v)){setItem('ui','last',v);SHADOW.ui.set('last',JSON.stringify(v));META.t[id]=Math.max(lt,it.ts)+1;touched.add('ui');return}}
  if(it.ts<lt)return;
  if(it.ts===lt){if(!dirty)return;const cur=SHADOW[it.kind].get(it.k);if(it.del?cur===undefined:cur===JSON.stringify(it.v)){META.p[id]=META.t[id];return}}
  let v=it.del?undefined:it.v;
  if(dirty&&!it.del&&it.kind==='ch'&&CH[it.k]){v=mergeCh(CH[it.k],it.v)}
  setItem(it.kind,it.k,v);touched.add(it.kind);
  const js=v===undefined?undefined:JSON.stringify(v);
  if(js===undefined)SHADOW[it.kind].delete(it.k);else SHADOW[it.kind].set(it.k,js);
  if(dirty&&it.kind==='ch'&&!it.del&&js!==JSON.stringify(it.v)){META.t[id]=++conflictTs}  /* merged: upload the union */
  else{META.t[id]=it.del?-it.ts:it.ts;META.p[id]=META.t[id]}});
 touched.forEach(kind=>{const K=KINDS[kind];_rawSave(K.sk,kind==='ui'?UI:K.get())});saveMeta();return touched}
function setItem(kind,k,v){if(kind==='ui'){if(v){UI.last=Object.assign({},v.last||{});if(v.lastBook)UI.lastBook=v.lastBook}return}
 const K=KINDS[kind];if(K.type==='arr'){const a=K.get();const i=a.findIndex(x=>x.id===k);if(v===undefined){if(i>=0)a.splice(i,1)}else if(i>=0)a[i]=v;else a.push(v);return}
 const o=K.get();if(v===undefined)delete o[k];else o[k]=v}
async function syncNow(manual){if(!SY.token||!syncApi())return;if(SYNCING){if(manual)return SYNCING;return}
 SYNCING=(async()=>{try{for(let round=0;round<20;round++){
   if(dirtyItems().length){/* pull first so concurrent edits from other devices get merged, not overwritten */
    const r0=await api('/api/sync',{since:SY.rev||0,items:[]});const t0=applyRemote(r0.items||[]);SY.rev=r0.rev;_rawSave('sync',SY);if(t0.size)afterRemote(t0);if(r0.more)continue}
   const items=dirtyItems().slice(0,400);const sent=new Map(items.map(x=>[x.kind+'\u0001'+x.k,x.del?-x.ts:x.ts]));
   const r=await api('/api/sync',{since:SY.rev||0,items});
   sent.forEach((t,id)=>{if(META.t[id]===t)META.p[id]=t});
   const touched=applyRemote(r.items||[]);SY.rev=r.rev;SY.last=Date.now();_rawSave('sync',SY);saveMeta();SYNC_ERR='';
   if(touched.size)afterRemote(touched);
   if(!r.more&&dirtyItems().length===0)break}
  if(manual)toast('已同步');}
 catch(e){SYNC_ERR=e.message;if(e.status===401&&e.code==='auth'){SY.token=null;_rawSave('sync',SY);toast('登录已失效，请重新登录')}else if(manual)toast('同步失败：'+e.message)}
 finally{SYNCING=null;syncBadge();if(/^#\/account/.test(location.hash)&&!document.activeElement.matches('input,textarea'))viewAccount()}})();return SYNCING}
function pushNow(keepalive){if(!SY.token||!syncApi())return;const items=dirtyItems().slice(0,400);if(!items.length)return;
 if(keepalive&&!(NAB&&NAB.request)){api('/api/sync',{since:SY.rev||0,items},{keepalive:true}).then(r=>{items.forEach(x=>{const id=x.kind+'\u0001'+x.k;if(META.t[id]===(x.del?-x.ts:x.ts))META.p[id]=META.t[id]});saveMeta()}).catch(()=>{});return}
 syncNow(false)}
function afterRemote(touched){
 const typing=document.activeElement&&document.activeElement.matches('input,textarea');
 const h=location.hash||'#/';
 if(/^#\/b\/[^/]+\/\d+/.test(h)){if(CUR&&CUR.b){const toc=document.getElementById('toc');if(toc)toc.innerHTML=tocHTML(CUR.b,CUR.ci);const c=chget(CUR.b,CUR.ci);const seg=document.getElementById('seg');if(seg)seg.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i===c.s))}return}
 if(typing)return;if(/^#\/(account|data|ask|search)/.test(h))return;const y=window.scrollY;route();window.scrollTo(0,y)}
setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine!==false)syncNow(false)},60000);
window.addEventListener('online',()=>syncNow(false));
window.addEventListener('storage',e=>{if(!e.key||!e.key.startsWith(P))return;const k=e.key.slice(P.length);
 if(k==='log')LOG=load('log',{});if(k==='pos')POS=load('pos',{});if(k==='sync')SY=load('sync',{});if(k==='meta'){META=load('meta',{t:{},p:{}})}
 if(SK2KIND[k])SHADOW[SK2KIND[k]]=snap(SK2KIND[k])});

/* ---- account page ---- */
function syncBadge(){const b=document.querySelector('#nav button[data-r=account]');if(!b)return;b.textContent=SY.token?(SYNC_ERR?'账号⚠':'账号☁'):'登录'}
function viewAccount(){
 const api0=syncApi();
 if(!SY.token){app.innerHTML=`<div style="max-width:460px"><h1 style="margin:0 0 6px;font-size:24px">登录 / 注册</h1>
 <div class="muted small" style="margin-bottom:12px">用手机号和密码登录后，阅读进度、标记、感悟、笔记、问答和阅读记录会在手机 App 和电脑浏览器之间自动同步。不用短信验证码。</div>
 <div class="card"><label class="small">手机号</label><input id="lgphone" inputmode="tel" autocomplete="username" value="${esc(SY.lastPhone||'')}" placeholder="例如 13800000000">
 <label class="small" style="display:block;margin-top:8px">密码</label><input id="lgpw" type="password" autocomplete="current-password" placeholder="至少 6 位" onkeydown="if(event.key==='Enter')doLogin('login')">
 <div class="row" style="margin-top:12px"><button class="primary" id="lgbtn" onclick="doLogin('login')">登录</button><button onclick="doLogin('register')">注册新账号</button></div><div id="lgmsg" class="small" style="margin-top:8px"></div></div>
 <details style="margin-top:14px"><summary class="small muted">同步服务器</summary><div class="card" style="margin-top:6px"><input id="lgapi" value="${esc(api0)}" placeholder="https://…"><div class="row" style="margin-top:6px"><button class="small" onclick="SY.api=document.getElementById('lgapi').value.trim();_rawSave('sync',SY);toast('已保存')">保存</button><button class="small" onclick="testApi()">测试连接</button></div></div></details>
 <div class="small muted" style="margin-top:10px">不登录也能正常使用，所有记录保存在本机。</div></div>`;syncBadge();return}
 const dn=dirtyItems().length;
 app.innerHTML=`<div style="max-width:620px"><h1 style="margin:0 0 12px;font-size:24px">我的账号</h1>
 <div class="card"><div>手机号：<b>${esc(SY.phone)}</b> ${SY.role==='admin'?'<span class="badge">管理员</span>':''}</div>
 <div class="small muted" style="margin-top:6px">上次同步：${SY.last?fmt(SY.last):'还没有'}${dn?` · 待上传 ${dn} 条`:''}${SYNC_ERR?` · <span style="color:var(--danger,#c33)">${esc(SYNC_ERR)}</span>`:''}</div>
 <div class="row" style="margin-top:10px"><button class="primary" onclick="syncNow(true)">立即同步</button><button onclick="pwForm()">修改密码</button><button class="danger" onclick="doLogout()">退出登录</button></div>
 <div class="small muted" style="margin-top:8px">打开时、每分钟、改动后几秒会自动同步；离线时照常使用，联网后自动补传。提问用的 Webhook 设置只留在本机，不同步。</div></div>
 <div id="pwbox"></div>
 ${SY.role==='admin'?`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">用户管理</h3><div id="ulist">${loadingHTML('载入用户…')}</div></div>`:''}
 <details style="margin-top:14px"><summary class="small muted">同步服务器</summary><div class="small muted" style="margin-top:6px">${esc(api0)}</div></details></div>`;
 syncBadge();if(SY.role==='admin')loadUsers()}
async function testApi(){const b=document.getElementById('lgapi').value.trim().replace(/\/+$/,'');try{await api('/api/health',undefined,{base:b,token:''});toast('连接正常')}catch(e){toast('连接失败：'+e.message)}}
async function doLogin(mode){const phone=document.getElementById('lgphone').value.trim(),pw=document.getElementById('lgpw').value;const msg=document.getElementById('lgmsg');
 const ai=document.getElementById('lgapi');if(ai&&ai.value.trim()&&ai.value.trim()!==syncApi()){SY.api=ai.value.trim()}
 if(!phone||!pw){msg.textContent='请填写手机号和密码';return}if(!syncApi()){msg.textContent='还没有设置同步服务器（展开下方「同步服务器」填写）';return}
 msg.textContent=mode==='login'?'正在登录…':'正在注册…';
 try{const r=await api('/api/'+mode,{phone,password:pw},{token:''});
  const hasLocal=Object.keys(CH).length||HL.length||QA.length;
  if(SY.lastPhone&&SY.lastPhone!==r.user.phone&&hasLocal&&!confirm(`本机现有的记录属于上一个账号（${SY.lastPhone}）。\n确定：合并到 ${r.user.phone}\n取消：先清空本机记录再登录`)){CH={};HL=[];QA=[];LOG={};POS={};saveAll();save('log',LOG);save('pos',POS);META={t:{},p:{}};Object.keys(KINDS).forEach(k=>SHADOW[k]=snap(k));saveMeta()}
  SY.token=r.token;SY.phone=r.user.phone;SY.role=r.user.role;SY.lastPhone=r.user.phone;SY.rev=0;META.p={};_rawSave('sync',SY);saveMeta();
  toast(mode==='login'?'登录成功，正在同步…':'注册成功，正在同步…');viewAccount();await syncNow(false);toast(SYNC_ERR?'同步失败：'+SYNC_ERR:'同步完成')}
 catch(e){msg.textContent=(mode==='login'?'登录失败：':'注册失败：')+e.message}}
async function doLogout(){if(!confirm('退出登录？本机的记录会保留，但不再同步。'))return;await syncNow(false).catch(()=>{});try{await api('/api/logout',{})}catch(e){}
 SY.token=null;SY.rev=0;_rawSave('sync',SY);META.p={};saveMeta();toast('已退出登录');viewAccount()}
function pwForm(){document.getElementById('pwbox').innerHTML=`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">修改密码</h3><input id="pwold" type="password" placeholder="原密码" autocomplete="current-password"><input id="pwnew" type="password" placeholder="新密码（至少 6 位）" style="margin-top:6px" autocomplete="new-password"><input id="pwnew2" type="password" placeholder="再输一次新密码" style="margin-top:6px" autocomplete="new-password"><div class="row" style="margin-top:8px"><button class="primary" onclick="doPw()">保存新密码</button></div><div id="pwmsg" class="small"></div></div>`}
async function doPw(){const o=document.getElementById('pwold').value,n=document.getElementById('pwnew').value,n2=document.getElementById('pwnew2').value,m=document.getElementById('pwmsg');
 if(n!==n2){m.textContent='两次输入的新密码不一样';return}try{await api('/api/password',{old:o,password:n});toast('密码已修改（其他设备需要重新登录）');document.getElementById('pwbox').innerHTML=''}catch(e){m.textContent='修改失败：'+e.message}}
async function loadUsers(){const el=document.getElementById('ulist');if(!el)return;try{const r=await api('/api/admin/users');
 el.innerHTML=`<table class="mtab"><tr><th>手机号</th><th>角色</th><th>记录</th><th>最近同步</th><th></th></tr>${r.users.map(u=>`<tr><td>${esc(u.phone)}${u.disabled?' <span class="badge warn">已停用</span>':''}</td><td>${u.role==='admin'?'管理员':'用户'}</td><td>${u.items}</td><td class="small">${u.last_seen?fmt(u.last_seen):'—'}</td><td><button class="small" onclick="adminReset('${esc(u.phone)}')">重置密码</button>${u.phone!==SY.phone?`<button class="small" onclick="adminDisable('${esc(u.phone)}',${u.disabled?0:1})">${u.disabled?'启用':'停用'}</button>`:''}</td></tr>`).join('')}</table>`}catch(e){el.innerHTML=errorHTML(e)}}
async function adminReset(phone){const p=prompt('给 '+phone+' 设置新密码（至少 6 位）：');if(!p)return;try{await api('/api/admin/reset',{phone,password:p});toast('已重置')}catch(e){toast('失败：'+e.message)}}
async function adminDisable(phone,d){if(!confirm((d?'停用 ':'启用 ')+phone+'？'))return;try{await api('/api/admin/disable',{phone,disabled:!!d});loadUsers()}catch(e){toast('失败：'+e.message)}}

/* start */
setTimeout(syncBadge,0);
if(SY.token)setTimeout(()=>syncNow(false),300);

/*/ADDON-JS*/
route();
</script>
